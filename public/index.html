<!DOCTYPE html>
<html>
<body>
  <!-- NAV + THEME (same snippet on every page; only the links and the active item differ) -->
  <nav class="topnav">
    <a href="/">Home</a><a class="active" href="/index.html">Chat</a><a href="/dashboard.html">Dashboard</a><a href="/demo.html">Messaging</a><button type="button" class="theme-btn" onclick="toggleTheme()" title="Switch light / dark">&#9680; Theme</button>
  </nav>
  <script>
    // light / dark theme: remembered in this browser (all pages are on localhost:3000, so they share it)
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
    function toggleTheme() {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem('theme', t); } catch { /* storage blocked: theme resets on reload */ }
    }
  </script>
  <style>
    /* shared theme: dark by default, light when <html data-theme="light">; same width and controls on every page */
    :root { color-scheme: dark; --bg: #0f1115; --fg: #e8e8e8; --panel: #1b1e24; --border: #2c3038; --muted: #9aa0aa; --nav: #16181d; --field: #3a3f48; --accent: #3b82f6; }
    :root[data-theme="light"] { color-scheme: light; --bg: #f5f6f8; --fg: #1f2328; --panel: #ffffff; --border: #d8dce2; --muted: #5f6670; --nav: #ffffff; --field: #c6ccd4; }
    body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 24px; box-sizing: border-box; }
    input, button { font: 15px system-ui, sans-serif; background: var(--panel); color: var(--fg); border: 1px solid var(--field); border-radius: 6px; padding: 7px 12px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }
    .topnav { display: flex; flex-wrap: wrap; gap: 4px; background: var(--nav); border: 1px solid var(--border); border-radius: 10px; padding: 6px; margin-bottom: 20px; font: 600 17px system-ui, sans-serif; }
    .topnav a { color: var(--fg); text-decoration: none; padding: 8px 16px; border-radius: 7px; }
    .topnav a:hover { background: var(--border); }
    .topnav a.active { background: var(--accent); color: #fff; }
    .topnav .theme-btn { margin-left: auto; font-weight: 600; }
  </style>

  <!-- Login section -->
  <div id="auth">
    <h3>Login or Register</h3>
    <p id="ended" role="status" style="display:none; padding:8px 12px; border-radius:6px; background:#fde2e2; color:#7f1d1d;"></p>
    <input id="username" placeholder="Username" />

    <span style="position:relative; display:inline-block;">
    <input id="password" type="password" placeholder="Password" style="padding-right:32px;" />
    <button type="button" id="togglePw" onclick="togglePassword()" aria-label="Show password"
    style="position:absolute; right:2px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; font-size:16px; padding:0 6px;">👁</button>
    </span>
    

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>

    <p>User ID: <b id="uid"></b></p>
    <p>Online: <span id="online">-</span></p>

    btn.textContent = show ? '👁 ' : '👁';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');

    // ---------- Auth ----------
    async function authRequest(path) {
      const res = await fetch('/api/auth/' + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) return window.toast(data.error); // e.g. "Username already taken", "Invalid username or password"
      token = data.token;
      try { localStorage.setItem('token', token); } catch { /* storage blocked: the chat page will ask to log in again */ }
      try { if (data.previousDevice) sessionStorage.setItem('previousDevice', JSON.stringify(data.previousDevice)); } catch { /* skip the notice */ }
      location.href = '/socketio.html';
    }
    const login = () => authRequest('login');
    const register = () => authRequest('register');

    function logout() {
      localStorage.removeItem('token');
      location.reload();
    }

    const ended = new URLSearchParams(location.search).get('ended'); // set by session-watch.js after a forced logout
    if (ended) {
      const p = document.getElementById('ended');
      p.textContent = ended === 'new_login' ? 'You were logged out because you logged in on another device.' : 'You were logged out.';
      p.style.display = 'block';

    if (token) location.href = '/socketio.html';
